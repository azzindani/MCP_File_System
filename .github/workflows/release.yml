name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    name: CI before release
    uses: ./.github/workflows/ci.yml

  # Publishes ghcr.io/<owner>/mcp-filesystem-fs-basic:<version> + :latest.
  # Uses the shared composite action hosted in MCP_Math so the build/push
  # mechanics stay in one place across all azzindani MCP_* repos.
  docker:
    name: Publish Docker image (GHCR)
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-filesystem-fs-basic
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build distributions
        run: |
          uv sync --all-extras
          uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
