name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Also build and push the GHCR container image"
        type: boolean
        default: false

jobs:
  ci:
    name: CI before release
    uses: ./.github/workflows/ci.yml

  # Publishes ghcr.io/<owner>/mcp-filesystem-fs-basic:<version> + :latest.
  # Uses the shared composite action hosted in MCP_Math so the build/push
  # mechanics stay in one place across all azzindani MCP_* repos.
  #
  # Opt-in, not automatic: a tag push cuts the GitHub Release only. The fleet
  # deploys from locally built images, so publishing a package on every tag
  # spends CI minutes on an artefact nothing pulls. To publish one, run this
  # workflow by hand against the tag with publish_image=true. `inputs` is null
  # on a push event, so the condition is false there without a second clause.
  docker:
    name: Publish Docker image (GHCR)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-filesystem-fs-basic
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # Full history: the changelog step below diffs against the previous tag,
      # and a depth-1 checkout has neither the tags nor the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `uv build` here, and no dist/* attachment. This server is installed
      # from source (install/install.sh clones the tag) or run as a container —
      # nothing has ever installed the wheel, so building one made every
      # release depend on the packaging metadata staying valid for a file
      # nobody downloads. GitHub still attaches its own source archives.
      # `generate_release_notes` alone lists merged PRs, and this repo pushes
      # straight to main -- so v0.2.0's page was published with nothing on it
      # but a compare link. The commit subjects are the record here; write them.
      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            LOG=$(git log --oneline --no-decorate | head -50)
          else
            LOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD" | head -50)
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$LOG" | sed 's/^/- /'
          } > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
