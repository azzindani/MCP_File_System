name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies (workspace)
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with pyright
        run: uv run pyright servers/ shared/
        continue-on-error: true

      - name: Verify tool docstrings (≤80 chars)
        run: uv run python tests/verify_tool_docstrings.py

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short
        env:
          PYTHONPATH: "."

  # ── Constrained mode (8 GB VRAM target) ─────────────────────────────
  # The matrix job above used to set MCP_CONSTRAINED_MODE on its test step, and
  # nothing ran without it, so the constrained branch of every get_max_* helper
  # was the only one CI ever saw. The matrix now runs at normal limits and this
  # job covers the other half.
  constrained:
    name: Constrained mode (ubuntu)
    runs-on: ubuntu-22.04

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies (workspace)
        run: uv sync --all-extras

      - name: Run tests in constrained mode
        run: uv run pytest tests/ -q --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-filesystem-fs-basic
          push: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
