[project]
name = "mcp-filesystem"
version = "0.1.2"
description = "Unified File System MCP Server — shared utilities"
requires-python = "==3.14.*"
readme = "README.md"
license = { text = "MIT" }

[tool.uv.workspace]
members = ["servers/fs_basic"]

[dependency-groups]
dev = ["mcp>=1.0.0,<2.0", "pyright>=1.1", "ruff>=0.4", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "servers"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
# Lint shared/, never rewrite it. These modules are meant to stay byte-identical
# with their siblings in the other repos, and the formatter forks them silently.
# MCP_File_System lints at line-length 100 and the rest at 120, which is how
# shared/oauth_bridge.py ended up 77 lines different from its twin by pure
# reflow, with nothing in the diff to say no logic had changed -- and how
# shared/counts.py forked on a single f-string within a day of being written.
# CI caught the second one: `ruff format --check` wanted to rewrite the file
# whose whole purpose is being the one copy.
exclude = ["shared/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "servers"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["servers", "shared"]
extraPaths = ["servers/fs_basic", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "servers/fs_basic"]
